<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio de Tiempos por Actividad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f5; --surface:#ffffff; --ink:#14262b; --muted:#5a6e73; --line:#d8e1e0;
  --accent:#0f6b6e; --accent-ink:#ffffff; --accent-soft:#dcefee;
  --good:#1b7a49; --good-soft:#dbf0e4; --warn:#8f5b00; --warn-soft:#fbeed0; --bad:#b0261e; --bad-soft:#fbe1de;
  --va:#2e9e6b; --ap:#4a8fd6; --es:#e0a82e; --re:#d4524a;
  --font-display:"Manrope","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e191c; --surface:#152428; --ink:#e5eeed; --muted:#93a9ad; --line:#26393d;
    --accent:#4fc3c1; --accent-ink:#06292a; --accent-soft:#143a3c;
    --good:#62d494; --good-soft:#123524; --warn:#efc060; --warn-soft:#3b2f10; --bad:#ff8f86; --bad-soft:#3d1c1a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e191c; --surface:#152428; --ink:#e5eeed; --muted:#93a9ad; --line:#26393d;
  --accent:#4fc3c1; --accent-ink:#06292a; --accent-soft:#143a3c;
  --good:#62d494; --good-soft:#123524; --warn:#efc060; --warn-soft:#3b2f10; --bad:#ff8f86; --bad-soft:#3d1c1a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);min-height:100%}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
h1{font-size:20px;letter-spacing:-.01em}
h2{font-size:18px}
h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:1100px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand small{color:var(--muted)}
.user{display:flex;gap:10px;align-items:center;margin-left:auto;font-size:13px;color:var(--muted);flex-wrap:wrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;min-height:8px}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:20px 16px 80px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.login{width:100%;max-width:420px;margin:40px auto 0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.col{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;min-width:0}
.field input[type=range]{padding:0;accent-color:var(--accent);height:36px}
.grow{flex:1 1 220px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th{background:var(--bg);text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.sel td{background:var(--accent-soft)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--bg);color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono)}
.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#tdisp{font:600 44px/1 var(--font-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:5.6ch}
.meter{position:relative;height:12px;background:var(--bg);border-radius:6px;min-width:120px;border:1px solid var(--line)}
.meter>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.meter.good>i{background:var(--va)}
.cellbar{display:flex;align-items:center;gap:10px;min-width:190px}
.cellbar .meter{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--bg);border-radius:8px;padding:12px 14px}
.kpi b{display:block;font:800 26px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c)}
.dist{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center}
.rank{display:grid;grid-template-columns:minmax(150px,340px) 1fr 62px;gap:10px;align-items:center}
.rank .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.rank .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.rbar{height:16px;background:var(--bg);border-radius:4px;border:1px solid var(--line);position:relative}
.rbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.div{position:relative;height:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;min-width:140px}
.div::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.div i{position:absolute;top:0;bottom:0;border-radius:5px}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;max-width:90vw;box-shadow:0 6px 24px #0004}
.toast[hidden]{display:none}
.steps{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input.mini{width:80px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px;text-align:right}
@media (max-width:560px){#tdisp{font-size:36px}.dist{grid-template-columns:100px 1fr 60px}.rank{grid-template-columns:110px 1fr 54px}}
@media (prefers-reduced-motion:no-preference){.meter>i,.stack i,.rbar i{transition:width .3s}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><h1>Estudio de tiempos por actividad</h1><small>Admisiones · Autorizaciones · Facturación · Auditoría · Radicación · Glosas · Producción general</small>
    <div class="user" id="user"></div></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</div></header>
<main id="main"></main>
<div class="toast" id="toast" hidden role="status"></div>

<script type="module">
/* =====================================================================
   1) CONFIGURACIÓN DE FIREBASE
   Reemplace este bloque por el que le da la consola de Firebase
   (Configuración del proyecto > Tus apps > Configuración del SDK).
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDJjCso67O2TyhM46vHH3vIP61tHh5M_94",
  authDomain: "estudio-de-metodos-y-tiempo.firebaseapp.com",
  projectId: "estudio-de-metodos-y-tiempo",
  storageBucket: "estudio-de-metodos-y-tiempo.firebasestorage.app",
  messagingSenderId: "769146710705",
  appId: "1:769146710705:web:d549349d175d9a7cb11090"
};
/* Nombre del estudio en la base de datos. Cambiarlo crea un estudio nuevo y vacío. */
const ESTUDIO = "principal";
/* ===================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDoc, setDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const CONFIG_OK = !String(firebaseConfig.apiKey).startsWith("PEGAR");
let app, auth, db;
if (CONFIG_OK) {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
}

/* ---------- Datos base ---------- */
const PROC=["Admisiones","Autorizaciones","Facturación","Auditoría","Radicación","Glosas","Producción general"];
const PCOL=["#4a8fd6","#2aa3a0","#2e9e6b","#e08a2e","#8a6fd1","#c9498f","#7a8b8f"];
const PREF={Admisiones:"ADM",Autorizaciones:"AUT","Facturación":"FAC","Auditoría":"AUD","Radicación":"RAD",Glosas:"GLO","Producción general":"PGF"};
const UNIT={Admisiones:"admisión realizada",Autorizaciones:"autorización tramitada","Facturación":"factura generada","Auditoría":"cuenta auditada","Radicación":"cuenta radicada",Glosas:"glosa respondida","Producción general":"factura completa generada"};
const TIPOS=["Valor agregado","Apoyo necesario","Espera / demora","Reproceso"];
const TCOL={"Valor agregado":"var(--va)","Apoyo necesario":"var(--ap)","Espera / demora":"var(--es)","Reproceso":"var(--re)"};
const ACTS0=[
["ADM-1","Recepción y verificación de documento del paciente","Admisiones"],["ADM-2","Validación de derechos y aseguradora (ADRES/EPS)","Admisiones"],["ADM-3","Registro de datos en el sistema","Admisiones"],["ADM-4","Orden de ingreso y firma de consentimientos","Admisiones"],
["AUT-1","Revisión de orden médica y soportes","Autorizaciones"],["AUT-2","Solicitud a la EPS (portal, correo o llamada)","Autorizaciones"],["AUT-3","Seguimiento a la respuesta de la EPS","Autorizaciones"],["AUT-4","Registro del número de autorización","Autorizaciones"],["AUT-5","Notificación al servicio","Autorizaciones"],
["FAC-1","Consolidación de cargos (insumos, medicamentos, honorarios)","Facturación"],["FAC-2","Verificación de autorización y soportes","Facturación"],["FAC-3","Liquidación y generación de la factura","Facturación"],["FAC-4","Validación y envío de factura electrónica","Facturación"],["FAC-5","Armado de la cuenta con soportes","Facturación"],
["AUD-1","Cotejo de historia clínica contra cargos","Auditoría"],["AUD-2","Verificación de tarifas y contrato","Auditoría"],["AUD-3","Identificación de inconsistencias","Auditoría"],["AUD-4","Registro de hallazgos y devolución al área","Auditoría"],["AUD-5","Aprobación de la cuenta","Auditoría"],
["RAD-1","Alistamiento y foliación de la cuenta","Radicación"],["RAD-2","Cargue en portal o entrega física","Radicación"],["RAD-3","Obtención de constancia de radicación","Radicación"],["RAD-4","Registro y seguimiento de radicados","Radicación"],
["GLO-1","Recepción y clasificación de la glosa","Glosas"],["GLO-2","Análisis de soportes y contrato","Glosas"],["GLO-3","Elaboración de la respuesta","Glosas"],["GLO-4","Envío de la respuesta y registro","Glosas"],["GLO-5","Conciliación y seguimiento","Glosas"],["GLO-6","Revisión del portal de la aseguradora","Glosas"],
["PGF-1","Factura completa (de la consolidación de cargos al envío)","Producción general"],
["PGF-2","Cargos de insumos, canastas y medicamentos","Producción general"],["PGF-3","Cargos de materiales de osteosíntesis","Producción general"]
].map(a=>({id:a[0],name:a[1],proc:a[2],freq:1}));
const DEF_PARAMS={sup:15,minObs:10,cv:30,tol:10};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dstr=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>dstr(new Date());
const nf1=new Intl.NumberFormat("es-CO",{maximumFractionDigits:1});
const pct=v=>v==null?"—":Math.round(v*100)+"%";
const tm=s=>{if(s==null)return "—";s=Math.round(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const mmss=(s,t)=>{const m=Math.floor(s/60),r=s-m*60;return String(m).padStart(2,"0")+":"+(t?r.toFixed(1).padStart(4,"0"):String(Math.round(r)).padStart(2,"0"))};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const median=a=>{if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const sd=a=>{if(a.length<2)return null;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1))};

/* ---------- Estado ---------- */
let S={params:{...DEF_PARAMS},acts:ACTS0.map(a=>({...a})),obs:[],conclu:""};
let MODE=CONFIG_OK?"cargando":"config";   // config | login | noauth | cargando | app
let USER=null,ROL="",MSG="",READY={est:false,obs:false},unsub=[],pending=false,creando=false;
let tab=(location.hash||"#resumen").slice(1);
const TABS=[["resumen","Resumen"],["observacion","Observación"],["actividades","Actividades"],["individual","Individual"],["analisis","Análisis"],["parametros","Parámetros"]];
if(!TABS.some(t=>t[0]===tab))tab="resumen";
const F={edit:null,act:"",func:"",serv:"Cirugía",unid:1,ritmo:100,tipo:"Valor agregado",mm:0,ss:0,nota:"",filtro:""};
const AF={proc:"Admisiones",name:""};
const AE={id:null,name:""};
let IND="",tmr={run:false,t0:0,acc:0},armed="",IMP=null;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}
const isAdmin=()=>ROL==="admin";
const canEdit=o=>isAdmin()||(USER&&o.creadoPor===USER.email);
function errMsg(e){
  const c=e&&e.code||"";
  if(c.includes("permission-denied"))return "No tiene permiso para esta acción.";
  if(c.includes("unavailable"))return "Sin conexión con la base de datos. Se reintentará.";
  return "No se pudo guardar ("+(c||e.message||"error")+").";
}
const errT=e=>{console.error(e);toast(errMsg(e))};

/* ---------- Firebase: referencias y sincronización ---------- */
const estRef=()=>doc(db,"estudios",ESTUDIO);
const obsCol=()=>collection(db,"estudios",ESTUDIO,"observaciones");
const obsRef=id=>doc(db,"estudios",ESTUDIO,"observaciones",id);
function saveEst(){
  setDoc(estRef(),{params:S.params,acts:S.acts,conclu:String(S.conclu||"").slice(0,5000),actualizado:serverTimestamp(),actualizadoPor:USER.email}).catch(errT);
}
function stop(){unsub.forEach(f=>{try{f()}catch(e){}});unsub=[];READY={est:false,obs:false};creando=false}
function fail(e){console.error(e);if(e&&e.code==="permission-denied"){MODE="noauth";MSG="Su cuenta no tiene acceso a este estudio.";render()}else toast(errMsg(e))}
function check(){if(READY.est&&READY.obs){if(MODE!=="app"){MODE="app";render()}else liveRender()}}
function start(){
  stop();
  unsub.push(onSnapshot(estRef(),snap=>{
    if(!snap.exists()){
      if(!snap.metadata.fromCache&&!creando){creando=true;S.params={...DEF_PARAMS};S.acts=ACTS0.map(a=>({...a}));saveEst()}
      return;
    }
    const d=snap.data();
    S.params={...DEF_PARAMS,...(d.params||{})};
    S.acts=Array.isArray(d.acts)?d.acts:ACTS0.map(a=>({...a}));
    if(!(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.concl))S.conclu=d.conclu||"";
    READY.est=true;check();
  },fail));
  unsub.push(onSnapshot(obsCol(),{includeMetadataChanges:true},snap=>{
    if(snap.docChanges().length||!READY.obs){
      S.obs=snap.docs.map(d=>{const x=d.data({serverTimestamps:"estimate"});return{
        id:d.id,fecha:x.fecha||"",act:x.act,sec:+x.sec||0,unid:+x.unid||1,ritmo:+x.ritmo||100,tipo:x.tipo||"Valor agregado",
        func:x.func||"",serv:x.serv||"",nota:x.nota||"",creadoPor:x.creadoPor||"",t:x.creado&&x.creado.toMillis?x.creado.toMillis():0}})
        .sort((a,b)=>a.t-b.t);
      READY.obs=true;check();
    }
    setSync(snap.metadata);
  },fail));
}
let LASTSYNC=null;
function setSync(m){
  LASTSYNC={hasPendingWrites:m.hasPendingWrites,fromCache:m.fromCache};
  const el=$("#sync");if(!el)return;
  if(m.hasPendingWrites){el.className="pill warn";el.textContent="Subiendo cambios…"}
  else if(m.fromCache){el.className="pill none";el.textContent="Sin conexión · guardado local"}
  else{el.className="pill good";el.textContent="En línea"}
}
/* Evita redibujar mientras alguien escribe: espera a que suelte el campo */
const typing=()=>{const a=document.activeElement;return a&&a.matches("input,select,textarea")&&$("#main").contains(a)};
function liveRender(){if(typing()){pending=true;return}render()}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pending&&!typing()){pending=false;render()}},0));

if(CONFIG_OK){
  onAuthStateChanged(auth,async u=>{
    stop();USER=u;ROL="";S.obs=[];
    if(!u){MODE="login";render();return}
    MODE="cargando";render();
    try{
      const s=await getDoc(doc(db,"autorizados",(u.email||"").toLowerCase()));
      if(!s.exists()){MODE="noauth";MSG="Su cuenta ("+u.email+") todavía no está autorizada. Pida acceso al administrador del estudio.";render();return}
      ROL=(s.data().rol||"usuario");
      start();
    }catch(e){
      console.error(e);MODE="noauth";
      MSG=e&&e.code==="unavailable"?"No hay conexión a internet para validar su acceso. Intente de nuevo cuando tenga conexión.":"No se pudo validar su acceso ("+(e.code||e.message)+").";
      render();
    }
  });
}

/* ---------- Cálculos ---------- */
function calc(){
  const P=S.params,sup=P.sup/100,act={};
  S.acts.forEach(a=>{
    const it=S.obs.filter(o=>o.act===a.id),per=it.map(o=>o.sec/o.unid),nor=it.map(o=>o.sec/o.unid*o.ritmo/100),n=it.length;
    const avg=mean(per),s=sd(per);
    act[a.id]={n,avg,med:median(per),min:n?Math.min(...per):null,max:n?Math.max(...per):null,sd:s,cv:s!=null&&avg?s/avg:null,
      std:n?mean(nor)*a.freq*(1+sup):null,contrib:n?avg*a.freq:null,ok:n>=P.minObs};
  });
  const proc={};
  PROC.forEach(name=>{
    const acts=S.acts.filter(a=>a.proc===name),meas=acts.filter(a=>act[a.id].n>0);
    const tObs=meas.length?meas.reduce((s,a)=>s+act[a.id].contrib,0):null;
    const tStd=meas.length?meas.reduce((s,a)=>s+act[a.id].std,0):null;
    let top=null;meas.forEach(a=>{if(!top||act[a.id].contrib>act[top.id].contrib)top=a});
    const ids=new Set(acts.map(a=>a.id)),ob=S.obs.filter(o=>ids.has(o.act));
    const tt={};TIPOS.forEach(t=>tt[t]=ob.filter(o=>o.tipo===t).reduce((s,o)=>s+o.sec,0));
    const tot=TIPOS.reduce((s,t)=>s+tt[t],0);
    proc[name]={acts:acts.length,meas:meas.length,suf:acts.filter(a=>act[a.id].ok).length,tObs,tStd,top,topShare:top&&tObs?act[top.id].contrib/tObs:null,
      tt,tot,espera:tot?(tt["Espera / demora"]+tt["Reproceso"])/tot:null,nobs:ob.length};
  });
  return{act,proc};
}
const pdot=n=>`<span class="dot" style="background:${PCOL[PROC.indexOf(n)]||"#888"}"></span>`;

    <div class="rbar" role="img" aria-label="${esc(a.id)}: promedio ${tm(c.avg)}"><i style="width:${c.avg/mx*100}%;background:${PCOL[PROC.indexOf(a.proc)]}"></i></div><span class="n">${tm(c.avg)}</span></div>`}).join("");

    <div class="stack" role="img" aria-label="${esc(n)}: ${TIPOS.map(t=>t+" "+pct(c.tt[t]/c.tot)).join(", ")}">${TIPOS.map(t=>`<i style="width:${c.tt[t]/c.tot*100}%;background:${TCOL[t]}" title="${t}: ${pct(c.tt[t]/c.tot)}"></i>`).join("")}</div>

  return`<section class="card"><div class="head"><div><h2>Tiempo actual por proceso</h2><p class="note" style="margin:4px 0 0;max-width:66ch">Tiempo observado promedio para producir una unidad: suma de sus actividades. El estándar propuesto agrega el ritmo y los suplementos (${P.sup}%) y es el punto de partida para definir cuánto debería tardar cada proceso.</p></div>

      <div class="kpi"><b>${medidas.length} de ${S.acts.length}</b><span>Actividades con al menos una medición</span></div>
      <div class="kpi"><b>${suf} de ${S.acts.length}</b><span>Actividades con muestra suficiente (≥ ${P.minObs})</span></div>
      <div class="kpi"><b>${PROC.filter(n=>C.proc[n].tObs!=null).length} de ${PROC.length}</b><span>Procesos con tiempo calculado</span></div>
    </div>
    <div class="tbl"><table><thead><tr><th>Proceso</th><th class="num">Tiempo observado (min:seg)</th><th class="num">Estándar propuesto</th><th>Actividad que más tiempo consume</th><th class="num">En espera o reproceso</th><th>Muestra suficiente</th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>

    ${rk||`<p class="muted">Aún no hay observaciones. Registre la primera en la pestaña Observación.</p>`}
  </section>
  <section class="card"><div><h2>Tipo de tiempo por proceso</h2><p class="note" style="margin:4px 0 0">Lo amarillo y lo rojo es tiempo detenido o repetido: la primera oportunidad de mejora del método.</p></div>

function vInd(){
  const C=calc(),P=S.params;
  const set=new Set();S.obs.forEach(o=>o.func&&set.add(o.func));
  const codes=[...set].sort((a,b)=>a.localeCompare(b,"es",{numeric:true}));
  if(!codes.includes(IND))IND=codes[0]||"";
  const rel=cd=>{
    const r=[];S.acts.forEach(a=>{const it=S.obs.filter(o=>o.act===a.id&&o.func===cd);if(!it.length||!C.act[a.id].avg)return;r.push(mean(it.map(o=>o.sec/o.unid))/C.act[a.id].avg-1)});
    return r.length?mean(r):null;
  };
  const lec=d=>d==null?'<span class="pill none">Sin referencia</span>':d<-P.tol/100?'<span class="pill good">Más rápido</span>':d>P.tol/100?'<span class="pill warn">Más lento</span>':'<span class="pill none">Dentro del promedio</span>';
  const bar=d=>{if(d==null)return"";const w=Math.min(Math.abs(d),.5)/.5*50;return`<div class="div" role="img" aria-label="${pct(d)} frente al promedio"><i style="${d<0?"right:50%;background:var(--va)":"left:50%;background:var(--es)"};width:${w}%"></i></div>`};
  const sg=d=>d==null?"—":(d>0?"+":"")+Math.round(d*100)+"%";
  const rank=codes.map(cd=>{const d=rel(cd);return`<tr class="${cd===IND?"sel":""}"><td><b>${esc(cd)}</b></td><td class="num">${S.obs.filter(o=>o.func===cd).length}</td>
    <td><div class="cellbar">${bar(d)}<span class="num" style="min-width:48px;text-align:right">${sg(d)}</span></div></td><td>${lec(d)}</td>
    <td><button class="btn sm" data-a="ind" data-id="${esc(cd)}">Ver detalle</button></td></tr>`}).join("");
  let det="";
  if(IND){
    const rows=S.acts.map(a=>{
      const it=S.obs.filter(o=>o.act===a.id&&o.func===IND);if(!it.length)return"";
      const avg=mean(it.map(o=>o.sec/o.unid)),gen=C.act[a.id].avg,d=gen?avg/gen-1:null;
      return`<tr><td>${pdot(a.proc)}${esc(a.id+" · "+a.name)}</td><td class="num">${it.length}</td><td class="num"><b>${tm(avg)}</b></td><td class="num">${tm(gen)}</td>
      <td><div class="cellbar">${bar(d)}<span class="num" style="min-width:48px;text-align:right">${sg(d)}</span></div></td><td>${lec(d)}</td></tr>`}).join("");
    det=`<section class="card"><div><h2>Detalle de ${esc(IND)}</h2><p class="note" style="margin:4px 0 0;max-width:66ch">Tiempo promedio por unidad del funcionario frente al promedio de todos. Más de ${P.tol}% por encima o por debajo se marca como más lento o más rápido. Con pocos funcionarios observados el promedio general se parece mucho a cada uno.</p></div>
      <div class="tbl"><table><thead><tr><th>Actividad</th><th class="num">Obs.</th><th class="num">Promedio (func.)</th><th class="num">Promedio (general)</th><th>Diferencia</th><th>Lectura</th></tr></thead><tbody>${rows||`<tr><td colspan="6" class="muted">Sin observaciones de este funcionario.</td></tr>`}</tbody></table></div></section>`;
  }
  return`<section class="card"><div><h2>Comparación entre funcionarios</h2><p class="note" style="margin:4px 0 0;max-width:66ch">Diferencia promedio de cada funcionario frente al tiempo general en las actividades que se le observaron. Sirve para entender por qué varían los tiempos y qué prácticas replicar, no para sancionar.</p></div>
    <div class="tbl"><table><thead><tr><th>Funcionario</th><th class="num">Observaciones</th><th>Diferencia promedio</th><th>Lectura</th><th></th></tr></thead><tbody>${rank||`<tr><td colspan="5" class="muted">Registre observaciones con un código de funcionario.</td></tr>`}</tbody></table></div>
  </section>${det}`;
}
function vParams(){
  const P=S.params;
  const f=(k,l,h)=>`<div class="field"><label for="m-${k}">${l}</label><input id="m-${k}" type="number" min="0" value="${P[k]}" data-p="${k}" style="width:140px"><span class="note">${h}</span></div>`;
  return`<section class="card"><div><h2>Parámetros</h2><p class="note" style="margin:4px 0 0">Todo se recalcula al instante con estos valores y se comparte con todos los usuarios del estudio.</p></div>
    <div class="row" style="align-items:flex-start;gap:20px">
    ${f("sup","Suplementos (%)","Necesidades personales, fatiga y demoras inevitables")}
    ${f("minObs","Observaciones mínimas por actividad","Menos que esto: estándar provisional")}
    ${f("cv","Variación alta desde (%)","Dispersión de los tiempos que se marca como Variable")}
    ${f("tol","Tolerancia entre funcionarios (%)","Diferencia aceptada frente al promedio")}
    </div></section>
  <section class="card"><h2>Cómo se calcula</h2>
    <ol class="steps">
      <li>Tiempo observado por unidad = duración del ciclo ÷ unidades del ciclo.</li>
      <li>Variación = desviación estándar ÷ promedio. Una variación alta indica métodos distintos o interrupciones.</li>
      <li>Tiempo normal = tiempo observado × valoración del ritmo.</li>
      <li>Estándar propuesto de la actividad = promedio del tiempo normal × veces por unidad × (1 + suplementos).</li>
      <li>Tiempo del proceso = suma de los tiempos de sus actividades.</li>
    </ol>
    <p class="note" style="margin:0">Buenas prácticas: observe varios funcionarios y turnos; explique que se mide el proceso, no a la persona; cronometre el ciclo completo sin interrumpir y anote las interrupciones.</p>
  </section>
  <section class="card"><h2>Datos</h2>
    <p class="note" style="margin:0">Los datos se guardan en la nube (Firebase) y se sincronizan entre todos los usuarios autorizados. Si se pierde la conexión, lo registrado queda en este equipo y se sube solo al volver internet. Exporte los CSV para llevarlos a Excel o tener respaldo.</p>
    <div class="row">
      <button class="btn" data-a="exp" data-k="obs">Exportar observaciones</button>
      <button class="btn" data-a="exp" data-k="acts">Exportar actividades</button>
      <button class="btn" data-a="exp" data-k="resumen">Exportar resumen</button>
      ${isAdmin()?`<button class="btn danger${armed==="all"?" armed":""}" data-a="clearAll">${armed==="all"?"¿Seguro? Borra todo para todos. Clic otra vez":"Borrar todo y empezar"}</button>`:""}
    </div></section>
  ${vImport()}`;
}
function vImport(){
  let body;
  if(!IMP){
    body=`<p class="note" style="margin:0;max-width:70ch">Suba el CSV de observaciones exportado de la versión anterior (botón «Exportar observaciones»). Antes de guardar verá cuántas filas se van a importar. Las filas que ya existen en el estudio se omiten, así que puede importar el mismo archivo dos veces sin duplicar.</p>

    ${IMP.newActs.length?`<p class="note" style="margin:0">Actividades nuevas: ${IMP.newActs.map(a=>esc(a.id+" · "+a.name)).join("; ")}</p>`:""}
    ${IMP.bad.length?`<p class="note" style="margin:0">Filas omitidas: ${IMP.bad.slice(0,10).map(b=>"fila "+b.n+" ("+esc(b.why)+")").join("; ")}${IMP.bad.length>10?"…":""}</p>`:""}
    ${prev?`<div class="tbl"><table><thead><tr><th>Fecha</th><th>Actividad</th><th class="num">Duración</th><th class="num">Unid.</th><th class="num">Ritmo</th><th>Tipo</th><th>Func.</th></tr></thead><tbody>${prev}</tbody></table></div>${IMP.rows.length>8?`<p class="note" style="margin:0">Vista previa de las primeras 8 de ${IMP.rows.length}.</p>`:""}`:""}
    <div class="row"><button class="btn primary" data-a="doImport" ${IMP.rows.length?"":"disabled"}>Importar ${IMP.rows.length} observaciones</button><button class="btn" data-a="cancelImp">Cancelar</button></div>

  }

/* ---------- Importación CSV ---------- */
const norm=s=>String(s||"").replace(/^﻿/,"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
function parseCsv(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/)[0]||"",del=(first.split(";").length>=first.split(",").length)?";":",";
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===del){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
const numv=v=>{v=String(v??"").trim().replace(/\s/g,"");if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(v))v=v.replace(/\./g,"");return parseFloat(v.replace(",","."))};
function fechaIso(v){
  v=String(v||"").trim();let m;
  if(m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  if(m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/))return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  return null;
}
async function leerArchivo(file){
  const buf=await file.arrayBuffer();
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){return new TextDecoder("windows-1252").decode(buf)}
}
async function prepararImport(file){
  let rows;
  try{rows=parseCsv(await leerArchivo(file))}catch(e){return toast("No se pudo leer el archivo.")}
  if(rows.length<2)return toast("El archivo no tiene filas de datos.");
  const H=rows[0].map(norm),col=(...k)=>H.findIndex(h=>k.some(x=>h===x||h.startsWith(x)));
  const C={fecha:col("fecha"),proc:col("proceso"),act:col("actividad"),sec:col("segundos"),unid:col("unidades"),ritmo:col("ritmo"),tipo:col("tipo de tiempo","tipo"),func:col("funcionario"),serv:col("servicio"),nota:col("observaciones")};
  C.sec=H.findIndex(h=>h==="segundos");
  if(C.act<0||C.sec<0)return toast("No es un CSV de observaciones: faltan las columnas «Actividad» y «Segundos».");
  const key=o=>[o.fecha,o.act,Math.round(o.sec),o.unid,o.ritmo,o.tipo,o.func,o.nota].join("|");
  const exist=new Set(S.obs.map(key)),vistos=new Set();
  const out=[],bad=[],newActs=[];let dup=0;
  const tiposN=TIPOS.map(norm),procN=PROC.map(norm);
  for(let i=1;i<rows.length;i++){
    const r=rows[i],g=k=>C[k]>=0?String(r[C[k]]??"").trim():"";
    const at=g("act"),m=at.match(/^([A-Za-z]{2,4}-\d+)\s*(?:·|-|–)?\s*(.*)$/);
    if(!m){bad.push({n:i+1,why:"actividad sin código"});continue}
    const id=m[1].toUpperCase(),nombre=m[2].trim();
    if(!S.acts.some(a=>a.id===id)&&!newActs.some(a=>a.id===id)){
      const pi=procN.indexOf(norm(g("proc")));
      const proc=pi>=0?PROC[pi]:PROC.find(p=>PREF[p]===id.split("-")[0]);
      if(!proc){bad.push({n:i+1,why:"proceso desconocido para "+id});continue}
      newActs.push({id,name:(nombre||id).slice(0,120),proc,freq:1});
    }
    const sec=Math.round(numv(g("sec")));
    if(!(sec>0&&sec<=86400)){bad.push({n:i+1,why:"duración inválida"});continue}
    let unid=Math.floor(numv(g("unid")));if(!(unid>=1))unid=1;unid=Math.min(unid,1000);
    let ritmo=Math.round(numv(g("ritmo").replace("%","")));if(!(ritmo>=50&&ritmo<=150))ritmo=100;
    const ti=tiposN.indexOf(norm(g("tipo")));
    const o={fecha:fechaIso(g("fecha"))||today(),act:id,sec,unid,ritmo,tipo:ti>=0?TIPOS[ti]:"Valor agregado",
      func:g("func").slice(0,30),serv:g("serv").slice(0,60),nota:g("nota").slice(0,500)};
    const k=key(o);
    if(exist.has(k)||vistos.has(k)){dup++;continue}
    vistos.add(k);out.push(o);
  }
  const ej=out.length>0&&out.filter(o=>/^F-0[123]$/.test(o.func)&&o.serv==="Cirugía"&&!o.nota).length/out.length>.8;
  IMP={file:file.name,rows:out,dup,bad,newActs,ej};render();
}
function ejecutarImport(){
  if(!IMP||!IMP.rows.length)return;
  const {rows,newActs}=IMP;
  if(newActs.length){
    S.acts=S.acts.concat(newActs).sort((a,b)=>PROC.indexOf(a.proc)-PROC.indexOf(b.proc)||a.id.localeCompare(b.id,"es",{numeric:true}));
    saveEst();
  }
  for(let i=0;i<rows.length;i+=400){
    const bt=writeBatch(db);
    rows.slice(i,i+400).forEach(o=>bt.set(doc(obsCol()),{...o,creadoPor:USER.email,creado:serverTimestamp()}));
    bt.commit().catch(errT);
  }
  toast(rows.length+" observaciones importadas"+(newActs.length?" y "+newActs.length+" actividades creadas":"")+".");
  IMP=null;tab="resumen";location.hash=tab;render();
}

const cc=v=>{v=v==null?"":String(v);return/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const dc=v=>v==null?"":String(Math.round(v*100)/100).replace(".",",");
function csvData(k){
  const C=calc();let h,r,name;
  if(k==="obs"){name="observaciones";h=["Fecha","Proceso","Actividad","Segundos","Unidades","Ritmo %","Segundos por unidad","Tipo de tiempo","Funcionario","Servicio","Observaciones","Registrado por"];
    r=S.obs.map(o=>{const a=S.acts.find(x=>x.id===o.act);return[o.fecha,a?a.proc:"",actName(o.act),o.sec,o.unid,o.ritmo,dc(o.sec/o.unid),o.tipo,o.func,o.serv,o.nota,o.creadoPor]})}
  else if(k==="acts"){name="actividades";h=["Código","Actividad","Proceso","Observaciones","Promedio (s)","Mediana (s)","Mínimo (s)","Máximo (s)","Variación %","Veces por unidad","Estándar propuesto (s)","Muestra"];
    r=S.acts.map(a=>{const c=C.act[a.id];return[a.id,a.name,a.proc,c.n,dc(c.avg),dc(c.med),dc(c.min),dc(c.max),c.cv!=null?dc(c.cv*100):"",a.freq,dc(c.std),c.ok?"Suficiente":"Faltan "+(S.params.minObs-c.n)]})}
  else{name="resumen";h=["Proceso","Tiempo observado (s)","Estándar propuesto (s)","Actividad que más tiempo consume","% del tiempo del proceso","% en espera o reproceso","Observaciones","Actividades con muestra suficiente"];
    r=PROC.map(n=>{const c=C.proc[n];return[n,dc(c.tObs),dc(c.tStd),c.top?c.top.id+" · "+c.top.name:"",c.topShare!=null?dc(c.topShare*100):"",c.espera!=null?dc(c.espera*100):"",c.nobs,c.suf+" de "+c.acts]})}
  return{name,text:"\uFEFF"+[h].concat(r).map(a=>a.map(cc).join(";")).join("\n")};
}
function descargar(fn,data){
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Archivo descargado: "+fn);
  }catch(e){toast("No se pudo descargar el archivo.")}
}

/* ---------- Análisis general ---------- */
const MIN_FUNC=5;
function AN(){
  const C=calc(),P=S.params,tol=P.tol/100,cvmax=P.cv/100;
  const ok=S.obs.filter(o=>o.sec>0&&o.unid>0&&S.acts.some(a=>a.id===o.act));
  const ut=o=>o.sec/o.unid;
  const tot=ok.reduce((s,o)=>s+o.sec,0);
  const tt={};TIPOS.forEach(t=>tt[t]=ok.filter(o=>o.tipo===t).reduce((s,o)=>s+o.sec,0));
  const sh=t=>tot?tt[t]/tot:null;
  const fechas=ok.map(o=>o.fecha).filter(Boolean).sort();
  const funcs=[...new Set(ok.map(o=>o.func).filter(Boolean))];
  const servs=[...new Set(ok.map(o=>o.serv).filter(Boolean))];
  const G={n:ok.length,tot,va:sh("Valor agregado"),ap:sh("Apoyo necesario"),es:sh("Espera / demora"),re:sh("Reproceso"),
    desde:fechas[0]||"",hasta:fechas[fechas.length-1]||"",nf:funcs.length,ns:servs.length,
    nmed:S.acts.filter(a=>C.act[a.id].n>0).length,nact:S.acts.length,nsuf:S.acts.filter(a=>C.act[a.id].ok).length};
  G.desp=G.n?(G.es||0)+(G.re||0):null;
  const procs=PROC.map(n=>{const c=C.proc[n],t=c.tt;return{n,acts:c.acts,meas:c.meas,suf:c.suf,nobs:c.nobs,tObs:c.tObs,tStd:c.tStd,
    brecha:c.tObs&&c.tStd?c.tStd/c.tObs-1:null,va:c.tot?t["Valor agregado"]/c.tot:null,desp:c.espera,top:c.top,topShare:c.topShare}});
  const acts=S.acts.filter(a=>C.act[a.id].n>0).map(a=>{
    const c=C.act[a.id],its=ok.filter(o=>o.act===a.id),cnt={};
    TIPOS.forEach(t=>cnt[t]=its.filter(o=>o.tipo===t).length);
    const dom=TIPOS.slice().sort((x,y)=>cnt[y]-cnt[x])[0];
    const tA=its.reduce((s,o)=>s+o.sec,0);
    const dsp=tA?its.filter(o=>o.tipo==="Espera / demora"||o.tipo==="Reproceso").reduce((s,o)=>s+o.sec,0)/tA:null;
    return{a,c,dom:its.length?dom:"",dsp,vr:c.cv!=null&&c.n>=3&&c.cv>cvmax};
  });
  const idx=o=>{const c=C.act[o.act];return c&&c.n>=2&&c.avg?ut(o)/c.avg:null};
  const grp=key=>{const m={};ok.forEach(o=>{const k=o[key];if(!k)return;const g=m[k]||(m[k]={k,n:0,t:0,ix:[]});g.n++;g.t+=o.sec;const i=idx(o);if(i!=null)g.ix.push(i)});
    return Object.values(m).map(x=>({k:x.k,n:x.n,t:x.t,ix:mean(x.ix)}))};
  const lect=g=>g.n<MIN_FUNC?"Muestra corta":g.ix==null?"Sin comparación":g.ix>1+tol?"Más lento que el promedio":g.ix<1-tol?"Más rápido que el promedio":"Dentro del rango";
  const fun=grp("func").sort((a,b)=>a.k.localeCompare(b.k,"es",{numeric:true})).map(g=>({...g,l:lect(g)}));
  const srv=grp("serv").sort((a,b)=>b.n-a.n).map(g=>({...g,l:lect(g)}));
  const dia=grp("fecha").sort((a,b)=>a.k.localeCompare(b.k));
  const out=ok.filter(o=>{const c=C.act[o.act];return c&&c.n>=5&&c.sd>0&&ut(o)>c.avg+2*c.sd})
    .map(o=>({o,a:S.acts.find(x=>x.id===o.act),avg:C.act[o.act].avg})).sort((a,b)=>b.o.fecha.localeCompare(a.o.fecha));
  const H=[];
  if(G.n){
    H.push(`Se analizaron ${G.n} observaciones${G.desde?" entre "+G.desde+" y "+G.hasta:""}, de ${G.nf} funcionario(s) y ${G.nmed} de ${G.nact} actividades.`);
    H.push(`Del tiempo observado, ${pct(G.va)} es valor agregado y ${pct(G.desp)} se va en esperas y reprocesos.`);
    const pd=procs.filter(p=>p.desp!=null).sort((a,b)=>b.desp-a.desp)[0];
    if(pd&&pd.desp>0)H.push(`El proceso con más pérdida por espera o reproceso es ${pd.n} (${pct(pd.desp)} de su tiempo).`);
    const top=acts.slice().sort((a,b)=>b.c.contrib-a.c.contrib)[0];
    if(top){const pr=procs.find(p=>p.n===top.a.proc);H.push(`La actividad que más tiempo consume por unidad es ${top.a.id} · ${top.a.name} (${tm(top.c.contrib)} min:seg${pr&&pr.tObs?", "+pct(top.c.contrib/pr.tObs)+" de "+pr.n:""}).`)}
    const vr=acts.filter(x=>x.vr).sort((a,b)=>b.c.cv-a.c.cv).slice(0,3);
    if(vr.length)H.push(`Mayor variación entre observaciones (más de ${P.cv}%): ${vr.map(x=>x.a.id+" ("+pct(x.c.cv)+")").join(", ")}. Conviene revisar por qué unas veces tarda mucho más.`);
    if(G.nact-G.nsuf>0)H.push(`${G.nact-G.nsuf} de ${G.nact} actividades aún no llegan a la muestra mínima de ${P.minObs} observaciones; sus promedios son orientativos.`);
    const fl=fun.filter(f=>f.l==="Más lento que el promedio"||f.l==="Más rápido que el promedio");
    if(fl.length)H.push(`Funcionarios fuera de ±${P.tol}% del promedio: ${fl.map(f=>f.k+" ("+Math.round(f.ix*100)+")").join(", ")}. Úselo para apoyar y entender el método, no para sancionar.`);
    if(out.length)H.push(`${out.length} observación(es) atípica(s): tardaron más de 2 desviaciones sobre el promedio de su actividad. Revise su nota.`);
  }
  return{G,procs,acts,fun,srv,dia,out,H,C,P};
}

function zipStore(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;

    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(lh.buffer),nm,data);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+sz});
  const cdsz=cd.reduce((s,x)=>s+x.length,0),end=new DataView(new ArrayBuffer(22));

function saveFile(fn,data){descargar(fn,data)}

/* ---------- Exportar a PDF ---------- */
function pdfBlob(){
  const D=AN(),G=D.G,P=D.P,W=842,Hh=595,M=36,CW=W-2*M;
  const pages=[];let cur=null,y=0;
  const MAP={"—":"-","–":"-","≥":">=","≤":"<=","↳":"-","…":"...","“":'"',"”":'"',"‘":"'","’":"'","±":"+/-"};
  const L1=s=>{let o="";for(const ch of String(s==null?"":s)){if(MAP[ch]!=null){o+=MAP[ch];continue}o+=ch.charCodeAt(0)<256&&ch.charCodeAt(0)>=32?ch:" "}return o.replace(/[\\()]/g,"\\$&")};
  const np=()=>{cur=[];pages.push(cur);y=Hh-M};
  const txt=(s,x,yy,sz,b)=>cur.push(`BT /F${b?2:1} ${sz} Tf ${x.toFixed(1)} ${yy.toFixed(1)} Td (${L1(s)}) Tj ET`);
  const rect=(x,yy,w,h,c)=>cur.push(`${c} rg ${x.toFixed(1)} ${yy.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re f 0 g`);
  const need=h=>{if(y-h<M+14)np()};
  const cw=(sz,b)=>sz*(b?0.56:0.5);
  const fit=(s,w,sz,b)=>{s=String(s==null?"":s);const m=Math.max(1,Math.floor((w-6)/cw(sz,b)));return s.length>m?s.slice(0,Math.max(1,m-2))+"..":s};
  const wrap=(s,w,sz,b)=>{const m=Math.max(10,Math.floor(w/cw(sz,b))),out=[];String(s==null?"":s).split(/\n/).forEach(par=>{let l="";par.split(/\s+/).forEach(wd=>{if((l+" "+wd).trim().length>m){if(l)out.push(l);l=wd}else l=(l+" "+wd).trim()});out.push(l)});return out};
  const h1=s=>{need(34);txt(s,M,y-14,16,1);y-=26};
  const h2=s=>{need(40);y-=8;txt(s,M,y-11,12,1);y-=20};
  const para=(s,sz=9,ind=0)=>wrap(s,CW-ind,sz).forEach(l=>{need(sz+4);txt(l,M+ind,y-sz,sz);y-=sz+3.5});
  const bullet=s=>{const ls=wrap(s,CW-14,9);ls.forEach((l,i)=>{need(13);if(i===0)txt("-",M+2,y-9,9);txt(l,M+12,y-9,9);y-=12.5})};
  const table=(cols,rows)=>{
    const sum=cols.reduce((s,c)=>s+c.w,0),k=CW/sum,cs=cols.map(c=>({...c,w:c.w*k})),sz=8;
    const head=()=>{need(30);rect(M,y-13,CW,13,"0.86 0.94 0.94");let x=M;cs.forEach(c=>{const t=fit(c.h,c.w,sz,1);txt(t,c.a==="r"?x+c.w-3-t.length*cw(sz,1):x+3,y-10,sz,1);x+=c.w});y-=14};
    head();
    rows.forEach(r=>{if(y-13<M+14){np();head()}let x=M;cs.forEach((c,i)=>{const t=fit(r[i],c.w,sz,0);txt(t,c.a==="r"?x+c.w-3-t.length*cw(sz,0):x+3,y-9.5,sz);x+=c.w});y-=12});
    if(!rows.length){txt("Sin datos.",M+3,y-9.5,sz);y-=12}
  };
  const tmx=v=>tm(v),pc=v=>pct(v);
  np();
  h1("Análisis general del estudio de tiempos");
  para(`Clínica La Esperanza  |  Generado el ${today()}  |  ${G.n} observaciones${G.desde?" ("+G.desde+" a "+G.hasta+")":""}`,9);
  y-=4;
  h2("Indicadores generales");
  table([{h:"Indicador",w:300},{h:"Valor",w:200,a:"r"}],[
    ["Observaciones analizadas",G.n],["Tiempo total observado (min:seg)",tmx(G.tot)],["Tiempo de valor agregado",pc(G.va)],["Apoyo necesario",pc(G.ap)],
    ["Espera / demora",pc(G.es)],["Reproceso",pc(G.re)],["Perdido en espera o reproceso",pc(G.desp)],
    ["Actividades con medición",G.nmed+" de "+G.nact],["Actividades con muestra suficiente (>= "+P.minObs+")",G.nsuf+" de "+G.nact],["Funcionarios observados",G.nf]]);
  h2("Hallazgos automáticos");D.H.forEach(bullet);
  if(S.conclu&&S.conclu.trim()){h2("Conclusiones del analista");para(S.conclu,9)}
  h2("Indicadores por proceso");
  table([{h:"Proceso",w:110},{h:"Observado",w:62,a:"r"},{h:"Estándar",w:62,a:"r"},{h:"Brecha",w:52,a:"r"},{h:"Valor agr.",w:56,a:"r"},{h:"Espera+reproc.",w:72,a:"r"},{h:"Cuello de botella",w:210},{h:"Muestra",w:56}],
    D.procs.map(p=>[p.n,tmx(p.tObs),tmx(p.tStd),p.brecha!=null?(p.brecha>0?"+":"")+pc(p.brecha):"-",pc(p.va),pc(p.desp),p.top?p.top.id+" · "+p.top.name:"-",p.suf+" de "+p.acts]));
  h2("Indicadores por actividad (min:seg por unidad)");
  table([{h:"Actividad",w:230},{h:"Obs.",w:30,a:"r"},{h:"Prom.",w:44,a:"r"},{h:"Mediana",w:48,a:"r"},{h:"Mín.",w:40,a:"r"},{h:"Máx.",w:40,a:"r"},{h:"Desv.",w:40,a:"r"},{h:"CV",w:38,a:"r"},{h:"Estándar",w:50,a:"r"},{h:"Tipo predom.",w:90},{h:"Esp+rep.",w:48,a:"r"},{h:"Muestra",w:56}],
    D.acts.map(x=>{const c=x.c;return[x.a.id+" · "+x.a.name,c.n,tmx(c.avg),tmx(c.med),tmx(c.min),tmx(c.max),tmx(c.sd),c.cv!=null?pc(c.cv):"-",tmx(c.std),x.dom,pc(x.dsp),c.ok?"Suficiente":"Faltan "+(P.minObs-c.n)]}));
  h2("Por funcionario (índice 100 = promedio de cada actividad)");
  table([{h:"Código",w:90},{h:"Obs.",w:50,a:"r"},{h:"Tiempo total",w:90,a:"r"},{h:"Índice",w:60,a:"r"},{h:"Lectura",w:200}],D.fun.map(g=>[g.k,g.n,tmx(g.t),ixTxt(g.ix),g.l]));
  h2("Por servicio");
  table([{h:"Servicio",w:90},{h:"Obs.",w:50,a:"r"},{h:"Tiempo total",w:90,a:"r"},{h:"Índice",w:60,a:"r"},{h:"Lectura",w:200}],D.srv.map(g=>[g.k,g.n,tmx(g.t),ixTxt(g.ix),g.l]));
  h2("Observaciones atípicas");
  table([{h:"Fecha",w:60},{h:"Actividad",w:230},{h:"Func.",w:46},{h:"Tiempo",w:46,a:"r"},{h:"Promedio",w:52,a:"r"},{h:"Tipo",w:90},{h:"Nota",w:200}],D.out.slice(0,40).map(x=>[x.o.fecha,x.a.id+" · "+x.a.name,x.o.func||"-",tmx(x.o.sec/x.o.unid),tmx(x.avg),x.o.tipo,x.o.nota||"-"]));
  pages.forEach((p,i)=>{const t=`Página ${i+1} de ${pages.length}`;p.push(`BT /F1 8 Tf ${(W-M-t.length*4).toFixed(1)} 20 Td (${L1(t)}) Tj ET`)});
  let out="%PDF-1.4\n";const offs=[];
  const add=(id,body)=>{offs[id]=out.length;out+=id+" 0 obj\n"+body+"\nendobj\n"};
  const n=pages.length;
  add(1,"<< /Type /Catalog /Pages 2 0 R >>");
  add(2,`<< /Type /Pages /Kids [${pages.map((p,i)=>(5+2*i)+" 0 R").join(" ")}] /Count ${n} >>`);
  add(3,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  add(4,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  pages.forEach((p,i)=>{const s=p.join("\n");
    add(5+2*i,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${Hh}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6+2*i} 0 R >>`);
    add(6+2*i,`<< /Length ${s.length} >>\nstream\n${s}\nendstream`)});
  const total=4+2*n,xr=out.length;
  out+=`xref\n0 ${total+1}\n0000000000 65535 f \n`;
  for(let i=1;i<=total;i++)out+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  out+=`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const u8=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u8[i]=out.charCodeAt(i)&255;
  return new Blob([u8],{type:"application/pdf"});
}
